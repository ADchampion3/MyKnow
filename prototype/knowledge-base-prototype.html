<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyKnow Prototype</title>
  <style>
    :root {
      --ink: #17242b;
      --muted: #6d7b80;
      --line: #dbe4e1;
      --paper: #f5f7f3;
      --panel: #ffffff;
      --mint: #2f7d69;
      --mint-soft: #e2f0e9;
      --amber: #bb752b;
      --amber-soft: #fff0d8;
      --rose: #a65352;
      --rose-soft: #fae7e3;
      --shadow: 0 18px 45px rgba(31, 55, 50, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .prototype-ribbon { position: fixed; top: 14px; right: 18px; z-index: 10; padding: 6px 10px; background: #17242b; color: #fff; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .shell { min-height: 100vh; padding: 34px 34px 110px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 26px; }
    .brand { display:flex; gap: 11px; align-items:center; }
    .brand-mark { width: 34px; height:34px; display:grid; place-items:center; border: 1px solid var(--ink); font-weight: 800; }
    .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.02em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .top-actions { display:flex; gap: 8px; align-items:center; }
    .icon-btn, .soft-btn, .primary-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 12px; border-radius: 6px; }
    .primary-btn { background: var(--mint); color: #fff; border-color: var(--mint); }
    .soft-btn:hover, .icon-btn:hover { border-color: var(--mint); color: var(--mint); }
    .primary-btn:hover { background: #256a59; }
    .layout { display:grid; gap: 18px; }
    .a-layout { grid-template-columns: 230px minmax(360px, 1fr) 320px; }
    .panel { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding: 16px 17px; border-bottom: 1px solid var(--line); }
    .panel-head h2, .section-title { margin:0; font-size: 13px; letter-spacing: .02em; }
    .panel-body { padding: 17px; }
    .eyebrow { color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; font-weight: 700; }
    .muted { color: var(--muted); }
    .space-list { padding: 10px; }
    .space { display:flex; justify-content:space-between; padding: 11px 10px; margin: 2px 0; border-radius: 5px; font-size: 13px; }
    .space.active { background: var(--mint-soft); color: #1d5b4b; font-weight: 700; }
    .space span:last-child { color: var(--muted); font-size: 11px; }
    .subtle-rule { border-top: 1px solid var(--line); margin: 14px 0; }
    .source { display:flex; gap: 9px; align-items:flex-start; padding: 10px 0; border-bottom: 1px solid #edf1ef; }
    .source:last-child { border-bottom:0; }
    .source input { margin-top: 3px; accent-color: var(--mint); }
    .source strong { display:block; font-size: 12px; font-weight: 650; }
    .source small { display:block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .hero { padding: 22px 22px 16px; border-bottom: 1px solid var(--line); }
    .hero h2 { margin: 5px 0 8px; font-size: 26px; letter-spacing: -.04em; }
    .hero p { max-width: 650px; color: var(--muted); font-size: 13px; line-height: 1.55; margin:0; }
    .hero-row { display:flex; justify-content:space-between; align-items:end; gap: 15px; }
    .metric-row { display:grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 18px; }
    .metric { padding: 12px; border: 1px solid var(--line); background: #fbfcfa; }
    .metric strong { display:block; font-size: 20px; margin-top:4px; }
    .metric span { color: var(--muted); font-size: 11px; }
    .wiki { padding: 19px 22px 24px; }
    .wiki-head { display:flex; justify-content:space-between; align-items:center; }
    .wiki h3 { font-size: 18px; margin: 0; }
    .wiki p { color: var(--muted); font-size: 13px; line-height:1.6; }
    .callout { border-left: 3px solid var(--mint); padding: 10px 13px; background: var(--mint-soft); font-size: 13px; line-height:1.5; margin: 16px 0; }
    .citation { color: #226653; text-decoration: underline; text-decoration-style: dotted; }
    .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-top: 12px; }
    .tag { padding: 4px 7px; background: #edf2ef; color: #53635f; font-size: 10px; border-radius: 3px; }
    .review-list { display:grid; gap: 8px; }
    .review { border:1px solid var(--line); padding: 11px; }
    .review-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .review strong { font-size:12px; }
    .review p { margin: 7px 0; color:var(--muted); font-size:11px; line-height:1.45; }
    .review-actions { display:flex; gap:6px; }
    .review-actions button { border:0; padding:5px 8px; font-size:11px; border-radius:4px; }
    .accept { background: var(--mint-soft); color:#1d5b4b; }
    .reject { background:#f1f3f1; color:var(--muted); }
    .chat { min-height: 500px; display:flex; flex-direction:column; }
    .chat-log { padding: 17px; display:grid; gap: 14px; flex:1; }
    .msg { max-width: 92%; padding: 11px 12px; font-size: 12px; line-height:1.55; }
    .msg.agent { background:#f1f5f2; border-left:3px solid var(--mint); }
    .msg.user { justify-self:end; background:var(--ink); color:#fff; }
    .chat-form { display:flex; gap:7px; padding: 12px; border-top:1px solid var(--line); }
    .chat-form input { min-width:0; flex:1; border:1px solid var(--line); padding: 9px 10px; outline:0; }
    .chat-form input:focus { border-color:var(--mint); }
    .statebar { position:fixed; left: 18px; bottom: 18px; z-index: 5; max-width: 430px; padding: 9px 12px; background: #17242b; color:#e9f2ed; font-size: 11px; box-shadow: var(--shadow); }
    .switcher { position:fixed; bottom: 18px; left:50%; transform:translateX(-50%); z-index: 6; display:flex; gap: 5px; align-items:center; padding:6px; background:#fff; border:1px solid #bac9c3; box-shadow: 0 12px 35px rgba(23,36,43,.16); }
    .switcher button { border:0; background:transparent; padding: 7px 10px; color:var(--muted); }
    .switcher button:hover { color:var(--ink); background:#f0f4f1; }
    .switcher .variant-label { min-width: 155px; color:var(--ink); text-align:center; font-size:11px; }
    .b-layout { grid-template-columns: minmax(300px, .85fr) minmax(420px, 1.35fr); align-items:start; }
    .queue-head { padding: 27px; background:#243a37; color:#fff; }
    .queue-head h2 { margin: 8px 0; font-size: 30px; letter-spacing:-.05em; }
    .queue-head p { color:#bed0c9; font-size: 13px; line-height:1.5; max-width:460px; }
    .queue { padding: 17px; }
    .queue-item { display:grid; grid-template-columns: 9px 1fr auto; gap: 11px; align-items:start; padding: 14px 4px; border-bottom:1px solid var(--line); }
    .queue-dot { width:9px; height:9px; margin-top: 4px; background: var(--amber); border-radius:50%; }
    .queue-item strong { font-size:13px; }
    .queue-item p { margin: 5px 0 0; color:var(--muted); font-size:11px; line-height:1.45; }
    .queue-item time { color:var(--muted); font-size:10px; white-space:nowrap; }
    .b-main { display:grid; gap:18px; }
    .b-card { background:var(--panel); border:1px solid var(--line); box-shadow: var(--shadow); padding:21px; }
    .b-card h3 { margin: 5px 0 12px; font-size: 19px; }
    .query-box { display:flex; gap:8px; border:1px solid var(--line); padding:7px; background:#fff; }
    .query-box input { flex:1; min-width:0; border:0; outline:0; padding:8px; }
    .result { margin-top: 16px; padding-top: 15px; border-top:1px solid var(--line); }
    .result h4 { margin:0 0 8px; font-size: 14px; }
    .result p { color:var(--muted); font-size:12px; line-height:1.6; }
    .c-layout { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
    .c-intro { grid-column: 1 / -1; display:flex; justify-content:space-between; align-items:end; padding: 8px 2px 5px; }
    .c-intro h2 { margin: 6px 0 0; font-size: 28px; letter-spacing:-.05em; }
    .c-intro p { max-width: 430px; color:var(--muted); font-size: 12px; line-height:1.5; }
    .c-column { min-height: 390px; padding: 16px; background:rgba(255,255,255,.72); border:1px solid var(--line); }
    .c-column h3 { display:flex; justify-content:space-between; margin:0 0 15px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; }
    .count { color:var(--muted); font-weight:400; }
    .c-item { padding: 13px; margin: 8px 0; background:#fff; border:1px solid var(--line); }
    .c-item strong { display:block; font-size:12px; }
    .c-item p { margin: 6px 0 0; color:var(--muted); font-size:11px; line-height:1.45; }
    .progress { height:4px; background:#e4ebe7; margin-top:12px; }
    .progress span { display:block; height:100%; background:var(--mint); }
    @media (max-width: 980px) { .a-layout, .b-layout, .c-layout { grid-template-columns:1fr; } .c-intro { display:block; } .shell { padding: 26px 16px 110px; } .topbar { align-items:flex-start; } .top-actions .soft-btn { display:none; } }
  </style>
</head>
<body>
  <div class="prototype-ribbon">Throwaway prototype</div>
  <main id="app"></main>
  <div id="statebar" class="statebar" aria-live="polite">状态：原型已就绪，数据仅保存在内存</div>
  <nav class="switcher" aria-label="原型方案切换">
    <button id="prev" title="上一个方案">←</button>
    <span class="variant-label" id="variant-label">A · 三栏工作台</span>
    <button id="next" title="下一个方案">→</button>
  </nav>
  <script>
    // Question: what should the first knowledge-work surface feel like? Three structural variants share stub data.
    const variants = [
      { key: 'A', name: '三栏工作台' },
      { key: 'B', name: '研究队列' },
      { key: 'C', name: '检索优先' }
    ];
    const state = {
      selectedSources: new Set(['ml', 'paper']),
      pending: 3,
      imports: 12,
      question: '',
      lastAction: '原型已就绪，数据仅保存在内存'
    };
    const qs = new URLSearchParams(location.search);
    let current = (qs.get('variant') || 'A').toUpperCase();
    if (!variants.some(v => v.key === current)) current = 'A';

    function setStatus(message) {
      state.lastAction = message;
      document.querySelector('#statebar').textContent = '状态：' + message;
    }
    function goVariant(key) {
      current = key;
      const url = new URL(location.href);
      url.searchParams.set('variant', key);
      history.replaceState({}, '', url);
      render();
      setStatus('已切换到方案 ' + key + ' · ' + variants.find(v => v.key === key).name);
    }
    function cycle(step) {
      const index = variants.findIndex(v => v.key === current);
      goVariant(variants[(index + step + variants.length) % variants.length].key);
    }
    function sourceToggle(id, checked) {
      checked ? state.selectedSources.add(id) : state.selectedSources.delete(id);
      setStatus('RAG 范围已更新：' + state.selectedSources.size + ' 份资料');
      render();
    }
    function ask(inputId) {
      const input = document.getElementById(inputId);
      const value = input && input.value.trim();
      if (!value) { setStatus('请输入一个研究问题'); return; }
      state.question = value;
      setStatus('已提交问题，正在使用 ' + state.selectedSources.size + ' 份资料检索');
      render();
    }
    function approve(index) {
      state.pending = Math.max(0, state.pending - 1);
      setStatus('已接受第 ' + (index + 1) + ' 条 Agent 变更建议，可回滚');
      render();
    }
    function importStub() {
      state.imports += 1;
      setStatus('已模拟导入 1 份 PDF，解析任务已加入队列');
      render();
    }
    function sourceMarkup() {
      const sources = [
        ['ml', '机器学习基础.md', '知识库 · 18 个片段'],
        ['paper', 'Attention Is All You Need.pdf', '论文 · 第 4 版'],
        ['web', '研究方法网页剪藏', '网页快照 · 2 天前']
      ];
      return sources.map(([id, title, meta]) => '<label class="source"><input type="checkbox" ' + (state.selectedSources.has(id) ? 'checked' : '') + ' data-source="' + id + '"><span><strong>' + title + '</strong><small>' + meta + '</small></span></label>').join('');
    }
    function commonTop() {
      return '<header class="topbar"><div class="brand"><div class="brand-mark">MK</div><div><h1>MyKnow</h1><p>个人研究知识库</p></div></div><div class="top-actions"><button class="soft-btn" data-import>＋ 导入资料</button><button class="icon-btn" title="任务日志">◷</button><button class="icon-btn" title="设置">⚙</button></div></header>';
    }
    function variantA() {
      return commonTop() + '<div class="layout a-layout"><aside class="panel"><div class="panel-head"><h2>知识库</h2><button class="icon-btn" title="新建知识库">＋</button></div><div class="space-list"><div class="space active"><span>机器学习</span><span>42</span></div><div class="space"><span>研究方法</span><span>18</span></div><div class="space"><span>待读整理</span><span>7</span></div><div class="subtle-rule"></div><div class="eyebrow" style="padding:4px 10px">当前 RAG 范围</div>' + sourceMarkup() + '</div></aside><section class="panel"><div class="hero"><div class="hero-row"><div><div class="eyebrow">知识库 · 机器学习</div><h2>从资料到可复用的理解</h2><p>Agent 已将 12 份资料整理为主题 Wiki。你可以先审核变更，再用选定资料进行问答。</p></div><button class="primary-btn" data-import>＋ 导入资料</button></div><div class="metric-row"><div class="metric"><span>资料</span><strong>' + state.imports + '</strong></div><div class="metric"><span>待审核</span><strong>' + state.pending + '</strong></div><div class="metric"><span>引用覆盖</span><strong>86%</strong></div></div></div><article class="wiki"><div class="wiki-head"><div><div class="eyebrow">Wiki 草稿 · 已更新 12 分钟前</div><h3>注意力机制如何改变序列建模</h3></div><button class="soft-btn">查看 diff</button></div><p>注意力机制允许模型直接计算序列中不同位置之间的依赖关系，而不必按时间步逐一传递状态。相比循环结构，它更适合并行训练，并能在长距离依赖上保持更稳定的信号。</p><div class="callout"><strong>Agent 建议</strong><br>将“缩放点积注意力”和“多头注意力”拆成两个事实条目，并分别链接到 <span class="citation">Attention Is All You Need.pdf · p.4</span>。</div><div class="tag-row"><span class="tag">深度学习</span><span class="tag">Transformer</span><span class="tag">待验证</span></div></article></section><aside class="panel chat"><div class="panel-head"><h2>研究助手</h2><span class="eyebrow">严格库内</span></div><div class="chat-log"><div class="msg agent">我会只使用左侧勾选的资料回答，并为关键结论附上原文位置。</div>' + (state.question ? '<div class="msg user">' + state.question + '</div><div class="msg agent">基于当前 ' + state.selectedSources.size + ' 份资料，注意力机制通过查询、键和值的相似度计算上下文权重。来源：<span class="citation">Attention Is All You Need.pdf · p.4</span>。</div>' : '<div class="msg agent">试试问：“为什么注意力机制适合并行训练？”</div>') + '</div><form class="chat-form" data-ask="a"><input id="ask-a" placeholder="输入研究问题…" value=""><button class="primary-btn">发送</button></form></aside></div>';
    }
    function variantB() {
      return commonTop() + '<div class="layout b-layout"><section class="panel"><div class="queue-head"><div class="eyebrow" style="color:#9ec4b4">本周研究节奏</div><h2>先处理重要的理解。</h2><p>把导入、冲突和待审核内容排成一条可完成的队列，减少在资料树里迷路。</p><button class="primary-btn" data-import>＋ 添加下一份资料</button></div><div class="queue"><div class="panel-head" style="padding:9px 0;border:0"><h2>你的队列</h2><span class="muted">3 项待处理</span></div><div class="queue-item"><span class="queue-dot"></span><div><strong>审核 3 条 Wiki 变更</strong><p>Agent 发现“位置编码”在两份论文中有不同表述。</p></div><time>现在</time></div><div class="queue-item"><span class="queue-dot" style="background:var(--rose)"></span><div><strong>处理一组重复资料</strong><p>检测到 2 个网页快照与一份 PDF 可能重复。</p></div><time>昨天</time></div><div class="queue-item"><span class="queue-dot" style="background:var(--mint)"></span><div><strong>继续“研究方法”主题</strong><p>上次停留在“可证伪性”的定义。</p></div><time>周一</time></div></div></section><section class="b-main"><div class="b-card"><div class="eyebrow">快速检索 · 当前范围 2 个知识库</div><h3>你想继续理解什么？</h3><form class="query-box" data-ask="b"><input id="ask-b" placeholder="例如：哪些来源支持这个结论？"><button class="primary-btn">检索</button></form><div class="tag-row"><span class="tag">机器学习</span><span class="tag">研究方法</span><span class="tag">严格库内</span></div>' + (state.question ? '<div class="result"><h4>回答 · ' + state.question + '</h4><p>当前范围内的资料指出，注意力机制通过全局依赖计算减少了顺序处理限制。引用：<span class="citation">Attention Is All You Need.pdf · p.4</span>。</p></div>' : '') + '</div><div class="b-card"><div class="eyebrow">正在审核 · Agent 变更计划</div><h3>把零散资料整理成 Wiki</h3><div class="review-list">' + reviewMarkup() + '</div></div></section></div>';
    }
    function reviewMarkup() {
      const items = ['新增“缩放点积注意力”事实条目', '将两份论文链接到 Transformer 主题', '给 4 个片段添加“待验证”标签'];
      return items.map((item, i) => '<div class="review"><div class="review-top"><strong>' + item + '</strong><span class="eyebrow">来源 2</span></div><p>依据：Attention Is All You Need.pdf · p.4；该变更不会修改原始资料。</p><div class="review-actions"><button class="accept" data-approve="' + i + '">接受</button><button class="reject">查看依据</button></div></div>').join('');
    }
    function variantC() {
      return commonTop() + '<div class="c-layout"><div class="c-intro"><div><div class="eyebrow">研究工作台 · 机器学习</div><h2>从一个问题开始。</h2></div><p>把搜索、证据和下一步动作放在同一张桌面上。知识库只是边界，问题才是入口。</p></div><section class="c-column"><h3>问题 <span class="count">01</span></h3><div class="c-item"><strong>为什么注意力机制适合并行训练？</strong><p>来自你的研究问题 · 4 条相关证据</p><div class="progress"><span style="width:78%"></span></div></div><div class="c-item"><strong>待验证：位置编码的两种解释</strong><p>检测到来源之间存在表述差异</p></div><button class="soft-btn" style="width:100%;margin-top:8px" data-focus>＋ 新问题</button></section><section class="c-column"><h3>证据 <span class="count">04 条</span></h3><div class="c-item"><strong>Attention Is All You Need.pdf</strong><p>p.4 · 缩放点积注意力 · 相关度 0.92</p></div><div class="c-item"><strong>机器学习基础.md</strong><p>第 8 节 · 序列建模 · 相关度 0.76</p></div><div class="c-item"><strong>研究方法网页剪藏</strong><p>快照 · 研究设计 · 相关度 0.51</p></div></section><section class="c-column"><h3>下一步 <span class="count">' + state.pending + ' 项</span></h3><div class="c-item"><strong>审核 Wiki 变更</strong><p>Agent 已准备好 3 条有引用的建议。</p><button class="accept" style="margin-top:9px;border:0;padding:6px 8px;font-size:11px" data-approve="0">接受第一条</button></div><div class="c-item"><strong>更新索引</strong><p>1 个网页快照等待重新解析。</p><div class="progress"><span style="width:42%;background:var(--amber)"></span></div></div></section></div>';
    }
    function render() {
      document.querySelector('#app').innerHTML = '<div class="shell">' + (current === 'A' ? variantA() : current === 'B' ? variantB() : variantC()) + '</div>';
      document.querySelector('#variant-label').textContent = current + ' · ' + variants.find(v => v.key === current).name;
      document.querySelectorAll('[data-source]').forEach(el => el.addEventListener('change', e => sourceToggle(e.target.dataset.source, e.target.checked)));
      document.querySelectorAll('[data-import]').forEach(el => el.addEventListener('click', importStub));
      document.querySelectorAll('[data-approve]').forEach(el => el.addEventListener('click', () => approve(Number(el.dataset.approve))));
      document.querySelectorAll('[data-ask]').forEach(form => form.addEventListener('submit', e => { e.preventDefault(); ask(form.dataset.ask === 'a' ? 'ask-a' : 'ask-b'); }));
      document.querySelectorAll('[data-focus]').forEach(el => el.addEventListener('click', () => { setStatus('新问题输入框将在真实产品中获得焦点'); }));
    }
    document.querySelector('#prev').addEventListener('click', () => cycle(-1));
    document.querySelector('#next').addEventListener('click', () => cycle(1));
    document.addEventListener('keydown', e => { if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
    render();
  </script>
</body>
</html>
